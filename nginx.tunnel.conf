# Proxy reverso usado só no modo túnel (ver docker-compose.tunnel.yml).
# Unifica frontend (Vite) e backend (Django) numa única origem — assim o
# navegador de quem acessa o link público nunca precisa saber o endereço
# "de verdade" de cada um (resolve o problema do VITE_API_URL fixo em
# localhost, e evita CORS por completo, já que tudo passa a ser
# same-origin do ponto de vista do navegador).

server {
    listen 8080;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Tudo o mais vai pro Vite — inclusive os caminhos internos dele
    # (/@vite/, /src/, etc.) e o websocket do hot-reload.
    location / {
        proxy_pass http://frontend:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

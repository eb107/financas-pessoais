[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Edson Melo", email = "86893604+eb107@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "celery>=5.6.3",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "RUF012", # mutable class defaults — false positive on Django's Meta/Admin classes
    "F405",   # names from `from .base import *` in dev/prod/test settings — intentional pattern
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
testpaths = ["apps"]
addopts = "-ra --cov=apps --cov-report=term-missing"
